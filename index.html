<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corintios Diario | 4 Capítulos Diarios (30 Min)</title>
    <meta name="description" content="Rutina diaria de 30 minutos de lectura bíblica: 4 capítulos diarios de 1ª y 2ª de Corintios con contexto y explicación de cada capítulo.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Cabecera Minimalista -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="3" x2="12" y2="21"></line>
                        <line x1="6" y1="8" x2="18" y2="8"></line>
                    </svg>
                </div>
                <div class="brand-titles">
                    <h1>CORINTIOS DIARIO</h1>
                    <p>4 Capítulos Diarios &bull; Rutina 30 Minutos</p>
                </div>
            </div>

            <div class="header-actions">
                <!-- Temporizador Silencioso de 30 Minutos en Cabecera -->
                <div class="header-timer" title="Temporizador de lectura de 30 minutos">
                    <button id="btnTimerToggleMini" class="btn-timer-icon" title="Iniciar 30 min de lectura">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    <span id="timerDigitsMini" class="timer-digits-mini">30:00</span>
                    <button id="btnTimerResetMini" class="btn-timer-icon" title="Reiniciar a 30:00">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
                    </button>
                </div>

                <!-- Contador de Racha de Días -->
                <div class="streak-pill" title="Racha de días completados">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2c1.1 0 2 .9 2 2 0 .7-.4 1.4-1 1.7V7c1.7 0 3 1.3 3 3 0 .8-.3 1.5-.8 2.1l1.4 1.4c.9-.9 1.4-2.1 1.4-3.5 0-2.8-2.2-5-5-5s-5 2.2-5 5c0 1.4.5 2.6 1.4 3.5l1.4-1.4C9.3 11.5 9 10.8 9 10c0-1.7 1.3-3 3-3V5.7c-.6-.3-1-1-1-1.7 0-1.1.9-2 2-2z"/>
                        <path d="M12 12c-2.21 0-4 1.79-4 4 0 2.21 1.79 4 4 4s4-1.79 4-4c0-2.21-1.79-4-4-4z"/>
                    </svg>
                    <span id="streakCount">0 días</span>
                </div>

                <!-- Ajuste de Tamaño de Letra -->
                <button id="fontSizeToggle" class="btn-icon" title="Ajustar tamaño de letra">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                </button>

                <!-- Modo Luz de Vela / Noche -->
                <button id="themeToggle" class="btn-icon" title="Alternar Modo Luz de Vela / Noche">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="app-main">

        <!-- Selector Rápido de Días del Plan (Día 1 a Día 8) -->
        <nav id="daysBar" class="days-bar" aria-label="Selector de día"></nav>

        <!-- Encabezado del Día Actual -->
        <section class="day-header-card">
            <div id="dayMetaBadge" class="day-meta-badge">RUTINA DIARIA (30 MIN) &bull; DÍA 1 DE 8</div>
            <h2 id="dayMainTitle" class="day-main-title">Día 1: 1ª de Corintios 1 al 4</h2>
            <p id="daySubtitle" class="day-subtitle">La Sabiduría de la Cruz, el Espíritu y los Siervos de Dios</p>

            <!-- Contexto y Resumen de la Jornada -->
            <div class="overview-context-box">
                <span class="context-tag">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    Contexto y Eje Temático del Día
                </span>
                <p id="overviewContextText" class="overview-context-text"></p>
                <div style="margin-top:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <span class="highlight-guide-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle></svg>
                        Versículos clave resaltados
                    </span>
                </div>
            </div>
        </section>

        <!-- Contenedor Dinámico de los 4 Capítulos del Día -->
        <section id="chaptersContainer" class="chapters-stream">
            <!-- Cada capítulo con su contexto y versículos se inyecta aquí -->
        </section>

        <!-- Botón de Completar Día -->
        <div class="day-footer-action">
            <button id="btnCompleteDay" class="btn-complete-day">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Completar lectura de los 4 capítulos de hoy
            </button>
        </div>

    </main>

    <!-- Notificación Toast -->
    <div id="toast" class="toast-msg">Mensaje</div>

    <!-- Scripts -->
    <script src="js/corinthians-data.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
